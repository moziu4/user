services:
  mongo:
    image: mongo:7
    container_name: user_mongodb
    volumes:
      - mongo:/data/db
    environment:
      - MONGO_INITDB_ROOT_USERNAME=dev
      - MONGO_INITDB_ROOT_PASSWORD=dev_pass
    ports:
      - "57017:27017"
    networks:
      - user-network

  nats:
    image: nats:latest
    container_name: user_nats
    ports:
      - "4222:4222"
    networks:
      - user-network

  redis:
    image: redis:latest
    container_name: user_redis
    ports:
      - "6379:6379"
    networks:
      - user-network

  user:
    image: user:latest
    container_name: user_service
    ports:
      - "4001:8080"
    environment:
      - MONGO_URI=mongodb://user:dev_pass@mongo_service:27017/user
      - URL_FRONT=http://localhost:8080
      - URL_FRONT_DEV=http://localhost:5173
      - NATS_URL=nats://nats_service:4222
      - MONGO_DATABASE=user
      - SECRET_KEY=my_secret
      - HTTP_BIND=0.0.0.0:8080
      - REDIS_URI=redis://redis_service:6379
      - CATALOGS_PATH=https://raw.githubusercontent.com/moziu4/catalogs/main/user-messages
    depends_on:
      - mongo
      - redis
      - nats
    networks:
      - user-network

networks:
  user-network:
    driver: bridge

volumes:
  mongo: